{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Доступ к Amazon</title>

    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Amazon</h1>

        <div style="text-align: center;">

            <h2>Доступ к сайту</h2>

            <p>
                Для просмотра сайта введите пароль.
            </p>

            <form method="POST">
                {% csrf_token %}

                <input
                    type="password"
                    name="password"
                    placeholder="Пароль"
                    required
                    autofocus
                >

                <button type="submit">
                    Войти
                </button>
            </form>

            {% if error %}
                <p style="color: red;">
                    {{ error }}
                </p>
            {% endif %}

        </div>

    </div>

</body>
</html>
